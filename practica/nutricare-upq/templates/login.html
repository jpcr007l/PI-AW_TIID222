{% extends 'base.html' %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-12">
    <div class="card bg-white shadow-xl border border-slate-200">
        <div class="card-body p-6 sm:p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-600 mb-3 shadow-inner">
                    <i class="fa-solid fa-heart-pulse text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Bienvenido a NutriCare</h1>
                <p class="text-xs text-slate-500 mt-1">Ingresa tus credenciales para acceder a tu portal clínico</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium text-slate-700"><i class="fa-solid fa-envelope mr-1 text-emerald-500"></i> Correo Electrónico</span>
                    </label>
                    <input type="email" id="emailInput" name="email" placeholder="usuario@nutricare.upq.edu.mx" required 
                           class="input input-bordered w-full focus:input-primary text-sm" />
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium text-slate-700"><i class="fa-solid fa-lock mr-1 text-emerald-500"></i> Contraseña</span>
                    </label>
                    <input type="password" id="passInput" name="password" placeholder="••••••••" required 
                           class="input input-bordered w-full focus:input-primary text-sm" />
                </div>

                <button type="submit" class="btn btn-primary w-full text-white mt-2 shadow-md">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Iniciar Sesión
                </button>
            </form>

            <div class="divider my-6 text-xs text-slate-400">ACCESOS RÁPIDOS DE PRUEBA</div>

            <div class="space-y-2">
                <p class="text-xs text-slate-500 text-center mb-2">Haz clic para autocompletar credenciales por rol:</p>
                <div class="grid grid-cols-1 gap-2">
                    <button type="button" onclick="fillCredentials('admin@nutricare.upq.edu.mx', 'admin123')" 
                            class="btn btn-outline btn-sm justify-between border-slate-300 hover:bg-slate-100 hover:text-slate-800 text-xs">
                        <span><i class="fa-solid fa-shield-halved text-slate-600 mr-2"></i> Administrador</span>
                        <span class="badge badge-sm badge-neutral">admin123</span>
                    </button>
                    <button type="button" onclick="fillCredentials('valeria.mendoza@nutricare.upq.edu.mx', 'medico123')" 
                            class="btn btn-outline btn-sm justify-between border-emerald-300 hover:bg-emerald-50 hover:text-emerald-800 text-xs">
                        <span><i class="fa-solid fa-user-doctor text-emerald-600 mr-2"></i> Nutrióloga (Médico)</span>
                        <span class="badge badge-sm badge-primary text-white">medico123</span>
                    </button>
                    <button type="button" onclick="fillCredentials('ana.garcia@gmail.com', 'paciente123')" 
                            class="btn btn-outline btn-sm justify-between border-teal-300 hover:bg-teal-50 hover:text-teal-800 text-xs">
                        <span><i class="fa-solid fa-hospital-user text-teal-600 mr-2"></i> Paciente (Ana Paula)</span>
                        <span class="badge badge-sm badge-accent text-white">paciente123</span>
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
function fillCredentials(email, pass) {
    document.getElementById('emailInput').value = email;
    document.getElementById('passInput').value = pass;
}
</script>
{% endblock %}
