{% extends 'base.html' %}
{% block title %}Mi Perfil - NutriCare{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-slate-800">Mi Perfil y Preferencias</h1>
        <span class="badge badge-outline text-slate-500 text-xs">Paciente</span>
    </div>

    <div class="card bg-white border border-slate-200 shadow-sm rounded-2xl">
        <div class="card-body p-6 sm:p-8">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-3xl font-bold shadow-inner">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-slate-800">{{ perfil.nombre }} {{ perfil.apellido }}</h2>
                    <p class="text-xs text-slate-500">{{ perfil.email }}</p>
                    <span class="badge badge-success text-white badge-xs mt-1">Cuenta Activa</span>
                </div>
            </div>

            <form action="{{ url_for('paciente_perfil') }}" method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label py-1"><span class="label-text text-xs font-semibold">Teléfono de Contacto</span></label>
                    <input type="tel" name="telefono" value="{{ perfil.telefono or '' }}" placeholder="Ej. 4421234567" class="input input-bordered input-sm w-full" />
                </div>

                <div class="form-control">
                    <label class="label py-1"><span class="label-text text-xs font-semibold">Alergias o Intolerancias Alimentarias</span></label>
                    <input type="text" name="alergias" value="{{ perfil.alergias or '' }}" placeholder="Ej. Lactosa, mariscos, gluten, cacahuates..." class="input input-bordered input-sm w-full" />
                </div>

                <div class="form-control">
                    <label class="label py-1"><span class="label-text text-xs font-semibold">Objetivo Nutricional Principal</span></label>
                    <textarea name="objetivo_salud" rows="2" class="textarea textarea-bordered textarea-sm w-full text-xs" placeholder="Ej. Pérdida de 5kg de grasa corporal, mejora de resistencia cardiovascular...">{{ perfil.objetivo_salud or '' }}</textarea>
                </div>

                <div class="divider my-2 text-xs text-slate-400">SEGURIDAD</div>

                <div class="form-control">
                    <label class="label py-1"><span class="label-text text-xs font-semibold">Cambiar Contraseña (opcional)</span></label>
                    <input type="password" name="password" placeholder="Dejar en blanco para mantener la actual" class="input input-bordered input-sm w-full" />
                </div>

                <div class="pt-4">
                    <button type="submit" class="btn btn-primary w-full text-white shadow-md">
                        <i class="fa-solid fa-check mr-2"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
